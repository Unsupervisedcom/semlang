version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      malloy-packages:
        patterns:
          - "@malloydata/*"
      typescript-tooling:
        patterns:
          - "@types/node"
          - "tsx"
          - "typescript"
          - "typescript-eslint"

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      docusaurus-packages:
        patterns:
          - "@docusaurus/*"
      react-packages:
        patterns:
          - "react"
          - "react-dom"
      typescript-tooling:
        patterns:
          - "typescript"
