name: check

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install DuckDB CLI
        run: |
          curl --fail --location --show-error \
            https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip \
            --output duckdb_cli-linux-amd64.zip
          unzip -q duckdb_cli-linux-amd64.zip
          sudo install -m 755 duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
